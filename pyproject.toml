[project]
name = "sentiment-app"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.34,<1",
    "scikit-learn>=1.5,<2",
    "clean-text>=0.6,<1",
    "Unidecode>=1.3,<2",
    "joblib>=1.4,<2",
    "cloudpickle>=3,<4",
    "torch>=2.5,<3",
    "sentence-transformers>=3,<6",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "pre-commit>=4,<5",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = '-m "not integration"'
markers = ["integration: requires the actual downloaded model files"]