repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff linter
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff formatter
        entry: uv run --locked ruff format
        language: system
        types: [python]
      - id: mypy
        name: Mypy type checker
        entry: uv run --locked mypy
        language: system
        types: [python]
        pass_filenames: false
